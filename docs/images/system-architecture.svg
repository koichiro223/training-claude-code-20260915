<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" font-family="sans-serif">
  <rect width="760" height="480" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#1f2937">システム構成図（クライアントのみ / Next.js App Router）</text>

  <!-- Browser boundary -->
  <rect x="30" y="55" width="700" height="400" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="46" y="80" font-size="14" font-weight="bold" fill="#374151">ブラウザ（クライアント）</text>

  <!-- UI Layer -->
  <rect x="55" y="100" width="650" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="70" y="124" font-size="13" font-weight="bold" fill="#1e3a8a">UI層（React Client Components 中心 + Tailwind CSS）</text>
  <rect x="75" y="138" width="180" height="56" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="90" y="163" font-size="12" fill="#1f2937">生活ログ画面</text>
  <text x="90" y="182" font-size="11" fill="#6b7280">一覧 / 追加 / 編集</text>
  <rect x="285" y="138" width="180" height="56" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="300" y="163" font-size="12" fill="#1f2937">予定画面</text>
  <text x="300" y="182" font-size="11" fill="#6b7280">一覧 / 実績化(1tap)</text>
  <rect x="495" y="138" width="190" height="56" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="510" y="163" font-size="12" fill="#1f2937">バルーン遊び画面</text>
  <text x="510" y="182" font-size="11" fill="#6b7280">開始 / 停止 / スコア</text>

  <!-- Domain/Hooks Layer -->
  <rect x="55" y="230" width="650" height="90" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="70" y="254" font-size="13" font-weight="bold" fill="#065f46">ドメイン / 状態管理層（BabyLogProvider [Context] ＋ カスタムフック・純粋関数）</text>
  <rect x="75" y="266" width="200" height="42" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="90" y="292" font-size="12" fill="#1f2937">useLogEntries()</text>
  <rect x="290" y="266" width="200" height="42" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="305" y="292" font-size="12" fill="#1f2937">useSchedules()</text>
  <rect x="505" y="266" width="180" height="42" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="520" y="292" font-size="12" fill="#1f2937">useBalloonGame()</text>

  <!-- Persistence Layer -->
  <rect x="55" y="340" width="650" height="95" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="70" y="364" font-size="13" font-weight="bold" fill="#92400e">永続化層</text>
  <rect x="75" y="376" width="290" height="46" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="90" y="398" font-size="12" fill="#1f2937">storage.ts（localStorage ラッパ）</text>
  <text x="90" y="415" font-size="11" fill="#6b7280">JSON serialize / validate</text>
  <rect x="385" y="376" width="300" height="46" rx="6" fill="#ffffff" stroke="#fcd34d"/>
  <text x="400" y="398" font-size="12" fill="#1f2937">Web Storage: localStorage</text>
  <text x="400" y="415" font-size="11" fill="#6b7280">キー: babylog.logs / .schedules / .schemaVersion</text>

  <!-- arrows -->
  <line x1="380" y1="210" x2="380" y2="230" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="320" x2="380" y2="340" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
